<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE TAPE</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:12px}
h1{font-size:28px;margin:0} h1 span{color:#22c55e}
.sub{color:#9ca3af;font-size:12px;margin:6px 0 12px}
.box{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:#111827;border:1px solid #222;padding:12px;border-radius:10px;flex:1;min-width:100px}
.card b{font-size:20px;display:block}
.g{color:#22c55e}.r{color:#ef4444}
input,select{width:100%;background:#111827;color:#fff;border:1px solid #333;padding:11px;border-radius:8px;margin-bottom:8px;font-size:15px}
button{background:#22c55e;color:#000;border:0;padding:12px;border-radius:8px;font-weight:800;width:100%;font-size:16px}
table{width:100%;border-collapse:collapse;margin-top:10px} th{text-align:left;color:#9ca3af;padding:8px;border-bottom:1px solid #222} td{padding:9px 8px;border-bottom:1px solid #111;font-size:14px}
</style>
</head>
<body>
<h1>THE <span>TAPE</span></h1>
<div class="sub">NSE LIVE - YAHOO DIRECT - NO PROXY</div>
<div class="box">
<div class="card">ADVANCES<b class="g" id="adv">0</b></div>
<div class="card">DECLINES<b class="r" id="dec">0</b></div>
<div class="card">LOADED<b id="total">0</b></div>
</div>
<div id="status" style="color:#22c55e;font-size:13px">● loading...</div><br>
<input id="search" placeholder="Search RELIANCE, TCS...">
<select id="sort"><option value="change">Sort: % Change</option><option value="price">Sort: Price</option><option value="name">Sort: Name</option></select>
<button onclick="loadAll()">REFRESH</button>
<table><thead><tr><th>SYMBOL</th><th>LTP</th><th>CHG %</th><th>DAY RANGE</th></tr></thead><tbody id="tbody"></tbody></table>
<script>
var SYMBOLS=["RELIANCE","TCS","INFY","HDFCBANK","ICICIBANK","SBIN","ITC","LT","TITAN","BAJFINANCE","MARUTI","TATAMOTORS","TATASTEEL","HINDUNILVR","ASIANPAINT","NESTLEIND","WIPRO","TECHM","HCLTECH","POWERGRID","NTPC","ONGC","COALINDIA","ULTRACEMCO","SUNPHARMA","DIVISLAB","ADANIENT","ADANIPORTS","TATAPOWER","IRCTC","DMART","ZOMATO","PAYTM","NYKAA","IDEA","YESBANK","PNB","BANKBARODA","CANBK","FEDERALBNK","IDFCFIRSTB","INDUSINDBK","AXISBANK","KOTAKBANK","BAJAJFINSV","HDFCLIFE","SBILIFE","ICICIPRULI","BRITANNIA","DABUR","MARICO","COLPAL","GODREJCP","TATACONSUM","PIDILITIND","HAVELLS","VOLTAS","SIEMENS","ABB","HAL","BEL","BDL","MAZAGON","COCHINSHIP","PFC","RECLTD","IRFC","RVNL","HUDCO","NHPC","TORNTPOWER","ADANIPOWER","JSWENERGY","BSE","MCX","CDSL","IEX","DIXON","KAYNES","ZEEL","SUNTV","PVRINOX","INDHOTEL","LEMONTREE","CHALET","TATACHEM","SRF","PIIND","UPL","COROMANDEL","SUZLON","INOXWIND","TATATECH","BALRAMCHIN","EIDPARRY","MUTHOOTFIN","MANAPPURAM","LICI","TATACOMM","BHARTIARTL","JIOFIN","JSWSTEEL","SAIL","NMDC","HINDALCO","VEDL","GRSE","PARAS","MTARTECH","ASTRAL","APLAPOLLO","JINDALSTEL","HINDCOPPER"];
var data=[];
async function fetchYahoo(symbols){
  var qs=symbols.map(function(s){return s+".NS"}).join(",");
  var urls=["https://query1.finance.yahoo.com/v7/finance/quote?symbols="+encodeURIComponent(qs),"https://query2.finance.yahoo.com/v7/finance/quote?symbols="+encodeURIComponent(qs)];
  for(var i=0;i<urls.length;i++){
    try{
      var r=await fetch(urls[i]);
      if(!r.ok) continue;
      var j=await r.json();
      if(j && j.quoteResponse && j.quoteResponse.result) return j.quoteResponse.result;
    }catch(e){}
  }
  throw new Error("Yahoo blocked - REFRESH click pannu / VPN try pannu");
}
async function loadAll(){
  document.getElementById("status").textContent="● loading "+SYMBOLS.length+" symbols via Yahoo...";
  data=[];
  try{
    for(var b=0;b<SYMBOLS.length;b+=50){
      var chunk=SYMBOLS.slice(b,b+50);
      var res=await fetchYahoo(chunk);
      for(var i=0;i<res.length;i++){
        var q=res[i];
        var sym=(q.symbol||"").replace(".NS","").toUpperCase();
        var price=q.regularMarketPrice||0;
        var chg=q.regularMarketChange||0;
        var pct=q.regularMarketChangePercent||0;
        var low=q.regularMarketDayLow||price;
        var high=q.regularMarketDayHigh||price;
        if(!price) continue;
        data.push({sym:sym,price:price,chg:chg,pct:pct,low:low,high:high});
      }
      document.getElementById("total").textContent=data.length+" / "+SYMBOLS.length;
      document.getElementById("status").textContent="● loading... "+data.length+" / "+SYMBOLS.length;
    }
    document.getElementById("status").textContent="● LIVE - "+new Date().toLocaleTimeString()+" - Market Closed? LTP = Last Close";
    render();
  }catch(e){ document.getElementById("status").textContent="● Error: "+e.message; }
}
function render(){
  var q=document.getElementById("search").value.toUpperCase();
  var sort=document.getElementById("sort").value;
  var list=data.filter(function(d){return d.sym.indexOf(q)!==-1});
  if(sort=="change") list.sort(function(a,b){return b.pct-a.pct});
  if(sort=="price") list.sort(function(a,b){return b.price-a.price});
  if(sort=="name") list.sort(function(a,b){return a.sym.localeCompare(b.sym)});
  var adv=0,dec=0; for(var i=0;i<data.length;i++){ if(data[i].pct>0) adv++; if(data[i].pct<0) dec++; }
  document.getElementById("adv").textContent=adv; document.getElementById("dec").textContent=dec;
  document.getElementById("tbody").innerHTML=list.map(function(d){
    var cls=d.pct>=0?"g":"r";
    return "<tr><td><b>"+d.sym+"</b></td><td>"+d.price.toFixed(2)+"</td><td class='"+cls+"'>"+d.chg.toFixed(2)+" ("+d.pct.toFixed(2)+"%)</td><td>"+d.low.toFixed(2)+" - "+d.high.toFixed(2)+"</td></tr>";
  }).join("");
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);
loadAll();
</script>
</body>
</html>
