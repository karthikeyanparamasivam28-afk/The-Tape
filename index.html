<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSE 1647 Live - The Tape</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#0f172a;color:#fff;padding:12px;margin:0}
h1{text-align:center;font-size:20px;margin:5px}
.sub{text-align:center;color:#94a3b8;font-size:12px;margin-bottom:10px}
input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:none;background:#1e293b;color:#fff;font-size:15px;outline:none}
.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.card{background:#1e293b;padding:12px;border-radius:12px;min-width:140px;text-align:center;flex:1}
.card b{font-size:12px;color:#cbd5e1}.card h2{font-size:20px;margin:6px 0}
.up{color:#22c55e}.down{color:#ef4444}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}
th,td{padding:10px 8px;font-size:13px;border-bottom:1px solid #334155;text-align:left}
th{color:#94a3b8;cursor:pointer;user-select:none;position:sticky;top:0;background:#1e293b}
#status{text-align:center;font-size:11px;color:#facc15;margin:8px}
button{background:#22c55e;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin:10px auto;display:block}
</style>
</head>
<body>
<h1>📈 THE TAPE - NSE 1647 LIVE</h1>
<p class="sub">TradingView Scanner + Proxy Fix • Hyphen = Underscore • Auto Refresh 15 Sec</p>

<div class="top">
<div class="card"><b>NIFTY 50</b><h2 id="nifty">--</h2><span id="niftyChg">--</span></div>
<div class="card"><b>SENSEX</b><h2 id="sensex">--</h2><span id="sensexChg">--</span></div>
<div class="card"><b>BANK NIFTY</b><h2 id="banknifty">--</h2><span id="bankChg">--</span></div>
</div>

<input id="search" placeholder="Search 1647 symbols... 【entity-RELIANCE¦canonical_name=RELIANCE】, M&M, TCS..." oninput="filterTable()">
<div id="status">Loading 1647 symbols...</div>
<table><thead><tr>
<th onclick="sortBy('symbol')">SYMBOL ↕</th>
<th onclick="sortBy('close')">PRICE ↕</th>
<th onclick="sortBy('change')">% ↕</th>
<th onclick="sortBy('change_abs')">CHG ↕</th>
<th onclick="sortBy('high')">HIGH ↕</th>
<th onclick="sortBy('low')">LOW ↕</th>
<th onclick="sortBy('volume')">VOL ↕</th>
</tr></thead><tbody id="tbody"></tbody></table>
<button onclick="load1647()">🔄 Refresh Now</button>

<script>
let ALL_DATA = [];
let SORT_KEY = 'volume';
let SORT_DIR = -1;

function toTradingViewSymbol(raw){
  return raw.replace(/-/g,'_');
}

async function load1647(){
  document.getElementById("status").innerText = "Loading... "+new Date().toLocaleTimeString();
  // CORS FIX: Proxy via allorigins
  const tvUrl = "https://scanner.tradingview.com/india/scan";
  const url = "https://api.allorigins.win/raw?url=" + encodeURIComponent(tvUrl);
  const body = {
    "filter": [{"left":"exchange","operation":"in_range","right":["NSE"]}],
    "options": {"lang":"en"},
    "symbols": {"query": {"types": []}, "tickers": []},
    "columns": ["close","change","change_abs","high","low","volume","open","previous_close"],
    "sort": {"sortBy":"volume","sortOrder":"desc"},
    "range": {"from":0,"to":1647}
  };
  try{
    const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    const json = await res.json();
    const rows = json.data || [];
    ALL_DATA = rows.map(r=>{
      const ticker = r.s;
      const d = r.d;
      return {
        symbol: ticker.replace('NSE:','').replace('BSE:',''),
        tv_symbol: toTradingViewSymbol(ticker),
        close: d[0], change: d[1], change_abs: d[2], high: d[3], low: d[4], volume: d[5], open: d[6]
      };
    });
    document.getElementById("status").innerText = `✅ Loaded ${ALL_DATA.length} Symbols | ${new Date().toLocaleTimeString()} | Source: TradingView`;
    updateTop();
    render(ALL_DATA);
  }catch(e){
    document.getElementById("status").innerText = "❌ Error: "+e.message;
    console.error(e);
  }
}

function updateTop(){
  function setTop(id,chgId,sym){
    const f = ALL_DATA.find(x=>x.symbol===sym);
    if(!f) return;
    document.getElementById(id).innerText = Number(f.close).toFixed(2);
    const el = document.getElementById(chgId);
    el.innerText = `${f.change>=0?"+":""}${Number(f.change).toFixed(2)}% (${Number(f.change_abs).toFixed(2)})`;
    el.className = f.change>=0?"up":"down";
  }
  // NIFTY / BANKNIFTY are indices - may not be in NSE equity scan, so keep if found
  setTop("nifty","niftyChg","NIFTY");
  setTop("banknifty","bankChg","BANKNIFTY");
  // SENSEX is BSE - try fetch separately
  fetchSingleTop("BSE:SENSEX","sensex","sensexChg");
}

async function fetchSingleTop(symbol, id, chgId){
  try{
    const u = "https://api.allorigins.win/raw?url=" + encodeURIComponent(`https://scanner.tradingview.com/symbol?symbol=${symbol}&fields=close,change,change_abs`);
    const r = await fetch(u);
    const d = await r.json();
    document.getElementById(id).innerText = Number(d.close).toFixed(2);
    const el = document.getElementById(chgId);
    el.innerText = `${d.change>=0?"+":""}${Number(d.change).toFixed(2)}% (${Number(d.change_abs).toFixed(2)})`;
    el.className = d.change>=0?"up":"down";
  }catch(e){}
}

function render(data){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  data.forEach(r=>{
    const isUp = (r.change||0) >= 0;
    const cls = isUp?"up":"down";
    const sign = isUp?"+":"";
    tbody.innerHTML += `<tr>
      <td><b>${r.symbol}</b><br><small style="color:#64748b">${r.tv_symbol}</small></td>
      <td><b>${Number(r.close||0).toFixed(2)}</b></td>
      <td class="${cls}">${sign}${Number(r.change||0).toFixed(2)}%</td>
      <td class="${cls}">${sign}${Number(r.change_abs||0).toFixed(2)}</td>
      <td>${Number(r.high||0).toFixed(2)}</td>
      <td>${Number(r.low||0).toFixed(2)}</td>
      <td>${Number(r.volume||0).toLocaleString('en-IN')}</td>
    </tr>`;
  });
}

function filterTable(){
  const q = document.getElementById("search").value.toLowerCase().replace(/-/g,'_');
  const filtered = ALL_DATA.filter(r=> r.symbol.toLowerCase().includes(q) || r.tv_symbol.toLowerCase().includes(q));
  render(filtered);
}

function sortBy(key){
  if(SORT_KEY===key) SORT_DIR*=-1; else {SORT_KEY=key; SORT_DIR=1;}
  ALL_DATA.sort((a,b)=>{
    const av = a[key]||0, bv = b[key]||0;
    if(typeof av==="string") return SORT_DIR * av.localeCompare(bv);
    return SORT_DIR * (av - bv);
  });
  filterTable();
}

load1647();
setInterval(load1647, 15000);
</script>
</body>
</html>
